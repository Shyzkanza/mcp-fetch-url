name: Release

on:
  push:
    tags:
      - '*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: shyzkanza/mcp-scrapidou

jobs:
  # Job 1: Tests
  test:
    name: Test & Type Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci --ignore-scripts
    - run: npx tsc --noEmit
    - run: npm test
    - run: npm run build

  # Job 2: Build & push Docker image
  build-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract version from tag
      id: version
      run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Set version from tag
      run: npm version ${{ github.ref_name }} --no-git-tag-version

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}

  # Job 4: Deploy to VPS
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-image
    steps:
    - uses: actions/checkout@v4

    - name: Encode compose file
      run: echo "COMPOSE_B64=$(base64 -w 0 docker-compose.yml)" >> $GITHUB_ENV

    - name: Deploy stack
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
        envs: COMPOSE_B64
        script: |
          mkdir -p ~/scrapidou
          echo "$COMPOSE_B64" | base64 -d > ~/scrapidou/docker-compose.yml
          docker pull ghcr.io/shyzkanza/mcp-scrapidou:latest
          docker stack deploy -c ~/scrapidou/docker-compose.yml scrapidou
          docker service update --force --image ghcr.io/shyzkanza/mcp-scrapidou:latest scrapidou_mcp-scrapidou
          sleep 15
          docker service ls --filter name=scrapidou

  # Job 5: Health Check
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    steps:
    - name: Test API Health
      run: |
        for i in {1..5}; do
          echo "Attempt $i/5..."
          if curl -f -s https://scrapidou.rankorr.red/health; then
            echo ""
            echo "API is up!"
            exit 0
          fi
          sleep 10
        done
        echo "API not reachable after 5 attempts"
        exit 1

  # Job 5: Publish npm (après validation du deploy Docker)
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: health-check
    # Trusted publishing (OIDC) : plus de NPM_TOKEN à faire expirer — celui du 2026-02-24
    # a fait échouer la 2.2.4 en E404. Exige le dépôt déclaré « trusted publisher » sur npmjs.com.
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
    # Trusted publishing exige npm >= 11.5.1 (Node 24) ; check-latest évite un 24.x ancien en cache
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        check-latest: true
        registry-url: 'https://registry.npmjs.org'
        cache: 'npm'
    - run: npm ci --ignore-scripts
    - name: Set version from tag
      run: npm version ${{ github.ref_name }} --no-git-tag-version --allow-same-version
    - run: npm run build
    - name: Check if version already published
      id: check-version
      run: |
        PACKAGE_VERSION=$(node -p "require('./package.json').version")
        if npm view @shyzus/mcp-scrapidou@$PACKAGE_VERSION version 2>/dev/null; then
          echo "Version $PACKAGE_VERSION already published, skipping"
          echo "skip=true" >> $GITHUB_OUTPUT
        else
          echo "skip=false" >> $GITHUB_OUTPUT
        fi
    - name: Publish to npm (OIDC, provenance automatique)
      if: steps.check-version.outputs.skip == 'false'
      run: npm publish --access public
